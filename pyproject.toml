[project]
name = "psup-stacplanet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "s-boomi", email = "shadi.boomi@universite-paris-saclay.fr" }]
dependencies = [
  "omegapy>=3.3",
  "psup-scraper",
  "pydantic>=2.14.1",
  "pystac>=1.15.2",
  "stac-pydantic-extensions>=0.3.0",
  "typer>=0.27.3",
]

[project.scripts]
psup-stacplanet = "psup_stacplanet.cli:app"

[dependency-groups]
dev = [
  "prek>=0.5.7",
  "ruff>=0.17.3",
  "tombi>=1.9.7",
  "ty>=0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src", "tests"]
exclude = [".venv"]

[tool.ty.environment]
python = ".venv"

[tool.uv.sources]
psup-scraper = { git = "https://github.com/pdssp/psup-scraper" }
