services:
  server:
    image: server-nginx
    build:
      dockerfile: ./.docker/Dockerfile
      context: .
    volumes:
      - ./${OUTPUT_DIR}:/usr/share/nginx/html/catalog:ro
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - browser_network

  stac-browser:
    image: ghcr.io/radiantearth/stac-browser:latest
    depends_on:
      - server
    ports:
      - "8091:8080"
    environment:
      - SB_catalogUrl=http://localhost/catalog.json
      - SB_catalogTitle="PSUP STAC Browser"
    networks:
      - browser_network

networks:
  browser_network:
